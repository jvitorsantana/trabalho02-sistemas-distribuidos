[project]
name = "server"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.138",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
